name: Build iOS IPA (native SwiftUI, unsigned for SideStore)

on:
  workflow_dispatch:
    inputs:
      crash_offsets:
        description: '崩溃地址 offsets（空格分隔，如 0x10c738 0x10c9b0）→ 构建后用 dSYM atos 符号化并打印到日志'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# v3.9.41（SR51）：任何两次构建都不并行。原先无 concurrency 组，重跑 / 反复推 tag / 手动触发撞上
# tag 触发时会同时跑两个 macos job：既各烧一份贵的 runner 分钟，又会往**同一个** release asset
# （qingliao-ipa-2，名字写死）写包——后者 --clobber 静默覆盖前者，下载到的 IPA 属于哪次构建说不清。
# 组名固定不区分 ref 正是为此：不同 ref 的并发同样会撞同一个 asset。
# cancel-in-progress 故意设 false：已在跑的让它跑完，中途取消等于白烧额度、还留个半截 release。
concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build-ipa:
    # v2.0.53：改回 macos-latest（Xcode 26，xcodegen 生成格式兼容）。
    # 之前 0 steps 失败其实是 private 仓库额度耗尽，不是 runner 故障；
    # macos-14 是 Xcode 15.4 读不了 xcodegen 2.45 生成的项目（Unable to read project）
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version literals
        # v3.9.41（SR53）：版本号在 project.yml 里是字面量（**每个 target 一份**
        # CFBundleShortVersionString/CFBundleVersion 与 MARKETING_VERSION/CURRENT_PROJECT_VERSION），
        # 全靠手改。漏一处就打出「主 App 3.9.41 / 挂件 3.9.40」的包；改了版本却忘了改 tag（或反之）
        # 会做出与 tag 名不同版的包，事后根本查不出来。跑在 Archive 前，几秒钟判掉。
        # v4.0.1：v4.0.1 起 target 有 3 个（主 App / 挂件 / 分享扩展）→ 12 处；且判据从「唯一值是否
        #   只有 1 个」升级为「每组键的数量 == target 数」——只比唯一值看不出**漏声明**（某 target
        #   少写一组键时唯一值仍是 1，XcodeGen 会给它默认写 1.0/1，打出来的包自报版本错）。
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          shorts=$(grep -E 'CFBundleShortVersionString:|MARKETING_VERSION:' project.yml \
                   | sed -E 's/.*:[[:space:]]*"([^"]*)".*/\1/' | sort -u)
          builds=$(grep -E '^ *CFBundleVersion:|CURRENT_PROJECT_VERSION:' project.yml \
                   | sed -E 's/.*:[[:space:]]*"([^"]*)".*/\1/' | sort -u)
          if [ -z "$shorts" ] || [ -z "$builds" ]; then
            echo "::error::project.yml 里没匹配到版本号字面量（键名被改动？请先同步这一步的 grep）"; exit 1
          fi
          # macOS runner 是 BSD wc：数字前补空格，字符串比较恒 != "1"（GNU/Linux 复现不出来）→ 先剥掉空白
          n_shorts=$(printf '%s\n' "$shorts" | wc -l | tr -d '[:space:]')
          n_builds=$(printf '%s\n' "$builds" | wc -l | tr -d '[:space:]')
          if [ "$n_shorts" != "1" ]; then
            echo "::error::project.yml 短版本号不一致：$(printf '%s ' $shorts)"; exit 1
          fi
          if [ "$n_builds" != "1" ]; then
            echo "::error::project.yml 构建号不一致：$(printf '%s ' $builds)"; exit 1
          fi
          # v4.0.1：数量判据（每个 target 4 组键各一处）
          n_targets=$(grep -cE '^ +type: (application|app-extension)' project.yml || true)
          for key in MARKETING_VERSION CFBundleShortVersionString CFBundleVersion CURRENT_PROJECT_VERSION; do
            n=$(grep -cE "^ *$key:" project.yml || true)
            if [ "$n" != "$n_targets" ]; then
              echo "::error::$key 只在 $n 处声明（$n_targets 个 target 应各一处）—— 有 target 会落成默认 1.0/1"
              exit 1
            fi
          done
          ver=$shorts
          if [ "$REF_TYPE" = "tag" ]; then
            tag=${GITHUB_REF_NAME#v}
            if [ "$tag" != "$ver" ]; then
              echo "::error::tag=$GITHUB_REF_NAME 与 project.yml 版本 $ver 不符 —— 推 tag 前先改 project.yml"
              exit 1
            fi
          fi
          echo "版本一致：$ver (build $builds)"

      - name: Install XcodeGen
        # v3.9.41（SR51）：brew 装的是「当时的最新版」，公式一升级就可能换 .xcodeproj 生成格式
        # （见上面 runs-on 的注释：Xcode 15.4 读不了 xcodegen 2.45 生成的项目）。brew 没有版本化
        # 公式可锁，改成装完立刻校验：2.x 放行并记录具体版本，跨大版本直接红，别让错格式的
        # 项目一路跑到 Archive 才报难懂的 "Unable to read project"。
        run: |
          brew install xcodegen
          V=$(xcodegen --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          echo "xcodegen 版本：$V"
          case "$V" in
            2.*) echo "compatible-major (2.x)";;
            *) echo "::error::未验证的 xcodegen 主版本 ${V:-未知}，本项目按 2.x 生成格式配置，请改 project.yml 后显式放行"; exit 1;;
          esac

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Metal toolchain（仅当仓库里还有 .metal 时才需要）
        # v3.9.2：本仓首次引入 .metal（当时的 AI 头像液态球着色器）。缺这一步 Archive 会报
        # "cannot execute tool 'metal' due to missing Metal Toolchain"（actions/runner-images#13014 仍 open）。
        # v3.9.78：球渲染器（LiquidOrbAvatar + LiquidOrbEffect.metal）已删除，全仓 **0 个 .metal**
        # → 默认跳过（省一轮组件下载）；哪天再加 .metal，本步自动生效，不用回来改。
        run: |
          if find qingliao -name '*.metal' | grep -q .; then
            echo "发现 .metal 源文件 → 安装 Metal Toolchain"
            xcodebuild -downloadComponent MetalToolchain || true
          else
            echo "全仓无 .metal → 跳过 Metal Toolchain 安装"
          fi

      - name: Archive (unsigned)
        run: |
          xcodebuild -project 轻聊.xcodeproj \
            -scheme Qingliao \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA (Payload zip, for SideStore)
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/App.xcarchive/Products/Applications/Qingliao.app build/ipa/Payload/
          cd build/ipa && zip -qry ../qingliao-2.0-unsigned.ipa Payload/
          ls -la ../qingliao-2.0-unsigned.ipa

      - name: Verify IPA
        run: |
          file build/qingliao-2.0-unsigned.ipa
          unzip -l build/qingliao-2.0-unsigned.ipa | head -8
          python3 - <<'PYEOF'
          import plistlib, sys, zipfile
          ipa = 'build/qingliao-2.0-unsigned.ipa'
          appex_dir = 'Payload/Qingliao.app/PlugIns/QingliaoWidget.appex/'
          need = [appex_dir + 'QingliaoWidget', appex_dir + 'Info.plist',
                  'Payload/Qingliao.app/Info.plist']
          with zipfile.ZipFile(ipa) as z:
              names = set(z.namelist())
              missing = [p for p in need if p not in names]
              if missing:
                  print('❌ 挂件未打进 Payload/Qingliao.app/PlugIns/：缺', missing)
                  print('  包内 appex 相关条目：', sorted(n for n in names if '.appex' in n)[:10])
                  sys.exit(1)
              app_plist = plistlib.loads(z.read('Payload/Qingliao.app/Info.plist'))
              appex_plist = plistlib.loads(z.read(appex_dir + 'Info.plist'))
          print('主 App 版本：%s(%s)' % (app_plist.get('CFBundleShortVersionString'), app_plist.get('CFBundleVersion')))
          print('挂件版本：%s(%s)' % (appex_plist.get('CFBundleShortVersionString'), appex_plist.get('CFBundleVersion')))
          if app_plist.get('NSSupportsLiveActivities') is not True:
              print('❌ 主 App Info.plist 缺 NSSupportsLiveActivities —— 实时活动不会生效')
              sys.exit(1)
          ext = (appex_plist.get('NSExtension') or {}).get('NSExtensionPointIdentifier')
          if ext != 'com.apple.widgetkit-extension':
              print('❌ appex 的 NSExtensionPointIdentifier 不是 widgetkit-extension：', ext)
              sys.exit(1)
          if appex_plist.get('CFBundleShortVersionString') != app_plist.get('CFBundleShortVersionString') \
             or appex_plist.get('CFBundleVersion') != app_plist.get('CFBundleVersion'):
              # v3.9.41（SR53）：原来只 ⚠️ 打印不拦——挂件与主 App 版本号不一致的包照样发到 release，
              # 侧载能装但挂件更新/实时活动行为不可控，而且没人会去看那行日志。
              print('❌ 挂件与主 App 版本不一致：app=%s(%s) appex=%s(%s) —— 核对 project.yml 的 12 处版本字面量'
                    % (app_plist.get('CFBundleShortVersionString'), app_plist.get('CFBundleVersion'),
                       appex_plist.get('CFBundleShortVersionString'), appex_plist.get('CFBundleVersion')))
              sys.exit(1)
          # v3.9.78：这里原来**硬断言**包内有 default.metallib（护着液态球着色器）。着色器文件已删除，
          # 断言如果留着，这一版必然在这里判红（全仓 0 个 .metal → 产物本来就不会有 default.metallib）。
          # 现在降级为**软诊断**：有就报一句，没有也只是提示（不再拦）。
          if 'Payload/Qingliao.app/default.metallib' in names:
              print('ℹ️ 包内有 default.metallib（仓库里又有 .metal 了？确认 Metal Toolchain 那步是否生效）')
          else:
              print('ℹ️ 包内无 default.metallib（符合预期：v3.9.78 起全仓无 .metal）')
          # v3.9.3：语音转文字改设备端识别，权限串必须在包里——缺了会在首次使用时崩（缺权限串访问麦克风）
          for key in ('NSMicrophoneUsageDescription', 'NSSpeechRecognitionUsageDescription'):
              if not app_plist.get(key):
                  print('❌ 主 App Info.plist 缺 %s —— 语音转文字首次使用会崩' % key)
                  sys.exit(1)
          print('✅ 语音权限串就位（麦克风 + 语音识别）')
          # v4.0.1：分享扩展同样要打进 PlugIns 且自报正确版本 —— 这一步原来只认挂件，
          # 分享扩展没编进去 / 版本不符 / PointIdentifier 写错时 **CI 全绿**（真机却在分享面板里
          # 要么看不到「轻聊」、要么点进去是个空白壳），正是本仓「本地绿 ≠ 能装」最贵的一类漏。
          # 二进制名不写死（PRODUCT_NAME 可能变）：按「appex 目录下非 Info.plist 的条目」判存在。
          share_dir = 'Payload/Qingliao.app/PlugIns/qingliaoShare.appex/'
          share_bins = sorted(n for n in names
                              if n.startswith(share_dir) and '/' not in n[len(share_dir):]
                              and n != share_dir + 'Info.plist')
          if share_dir + 'Info.plist' not in names or not share_bins:
              print('❌ 分享扩展未打进 Payload/Qingliao.app/PlugIns/（Info.plist=%s，二进制=%s）'
                    % (share_dir + 'Info.plist' in names, share_bins))
              print('  包内 appex 相关条目：', sorted(n for n in names if '.appex' in n)[:20])
              sys.exit(1)
          share_plist = plistlib.loads(z.read(share_dir + 'Info.plist'))
          share_point = (share_plist.get('NSExtension') or {}).get('NSExtensionPointIdentifier')
          if share_point != 'com.apple.share-services':
              print('❌ 分享扩展的 NSExtensionPointIdentifier 不是 share-services：', share_point)
              sys.exit(1)
          if share_plist.get('CFBundleShortVersionString') != app_plist.get('CFBundleShortVersionString') \
             or share_plist.get('CFBundleVersion') != app_plist.get('CFBundleVersion'):
              print('❌ 分享扩展与主 App 版本不一致：app=%s(%s) share=%s(%s) —— 核对 project.yml 的 12 处版本字面量'
                    % (app_plist.get('CFBundleShortVersionString'), app_plist.get('CFBundleVersion'),
                       share_plist.get('CFBundleShortVersionString'), share_plist.get('CFBundleVersion')))
              sys.exit(1)
          print('✅ 分享扩展 .appex 就位且配置正确（NSExtensionPointIdentifier=%s，%s）'
                % (share_point, share_bins[0].rsplit('/', 1)[-1]))
          print('✅ 挂件 .appex 就位且配置正确（NSExtensionPointIdentifier=%s）' % ext)
          PYEOF

      - name: Upload dSYM artifact (崩溃符号化留底, v3.4.2)
        uses: actions/upload-artifact@v4
        with:
          name: qingliao-dsym
          path: build/App.xcarchive/dSYMs
          if-no-files-found: ignore

      - name: Symbolicate crash offsets (atos)
        if: ${{ github.event.inputs.crash_offsets != '' }}
        run: |
          python3 - <<'PYEOF'
          import subprocess
          off_s = "${{ github.event.inputs.crash_offsets }}"
          dsym = 'build/App.xcarchive/dSYMs/Qingliao.app.dSYM/Contents/Resources/DWARF/Qingliao'
          for off in off_s.split():
              try:
                  addr = 0x100000000 + int(off, 16)
                  r = subprocess.run(['atos', '-o', dsym, '-l', '0x100000000', hex(addr)],
                                     capture_output=True, text=True)
                  print(f'{off}: {r.stdout.strip() or r.stderr.strip()}')
              except Exception as e:
                  print(f'{off}: ERR {e}')
          PYEOF

      - name: Upload IPA to GitHub Release (Hermes 下载后转存 NAS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create qingliao-ipa-2 build/qingliao-2.0-unsigned.ipa \
            --repo ${{ github.repository }} \
            --title "轻聊 2.0 IPA (native, unsigned)" \
            --notes "原生 SwiftUI · iOS 27 液态玻璃 · SideStore 导入安装" \
            || gh release upload qingliao-ipa-2 build/qingliao-2.0-unsigned.ipa \
               --repo ${{ github.repository }} --clobber
          echo "RELEASE_UPLOADED"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingliao-2.0-unsigned-ipa
          path: build/qingliao-2.0-unsigned.ipa
          if-no-files-found: error
