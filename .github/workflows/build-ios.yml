name: Build iOS IPA (unsigned, for SideStore)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor deps
        run: npm ci

      - name: Add iOS platform (generates Xcode project)
        run: |
          rm -rf ios   # 双保险：仓库绝不提交 ios/（Capacitor 生成物）
          npx cap add ios

      - name: Sync web assets into iOS project
        run: npx cap sync ios

      - name: Configure Info.plist (ATS allow http for LAN NAS)
        run: |
          plutil -insert NSAppTransportSecurity -json '{"NSAllowsArbitraryLoads": true}' ios/App/App/Info.plist
          plutil -insert NSAppTransportSecurity.NSAllowsLocalNetworking -bool true ios/App/App/Info.plist
          # 应用名中文 + 状态栏样式
          plutil -replace CFBundleDisplayName -string '轻聊' ios/App/App/Info.plist
          echo "--- Info.plist ATS ---"
          plutil -p ios/App/App/Info.plist | grep -A3 NSAppTransport

      - name: Archive (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA (Payload zip, for SideStore)
        run: |
          # exportArchive 要求 archive 含签名 team，unsigned 无法导出 → 手动打包
          mkdir -p build/ipa/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa && zip -qry ../qingliao-unsigned.ipa Payload/
          ls -la ../qingliao-unsigned.ipa

      - name: Verify IPA
        run: |
          file build/qingliao-unsigned.ipa
          unzip -l build/qingliao-unsigned.ipa | head -8

      - name: Push IPA to NAS (轻聊文件管理，手机直接下载)
        env:
          QL_PASS: ${{ secrets.QINGLIAO_PASS }}
          QL_SERVER: ${{ secrets.QINGLIAO_SERVER }}
        run: |
          TOKEN=$(curl -s -X POST "$QL_SERVER/api/auth/login" -H 'Content-Type: application/json' \
            -d "{\"username\":\"qingliao\",\"password\":\"$QL_PASS\",\"remember\":false}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("token",""))')
          if [ -z "$TOKEN" ]; then echo "::error::NAS 登录失败"; exit 1; fi
          RESP=$(curl -s -X POST "$QL_SERVER/api/files/upload" -H "X-Auth-Token: $TOKEN" \
            -F "file=@build/qingliao-unsigned.ipa;filename=qingliao-unsigned.ipa")
          echo "NAS 上传响应: $RESP"
          echo "$RESP" | grep -q '"ok":true' && echo "NAS_UPLOAD_OK" || { echo "::error::NAS 上传失败"; exit 1; }

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingliao-unsigned-ipa
          path: build/qingliao-unsigned.ipa
          if-no-files-found: error
