name: Build iOS IPA (native SwiftUI, unsigned for SideStore)

on:
  workflow_dispatch:
    inputs:
      crash_offsets:
        description: '崩溃地址 offsets（空格分隔，如 0x10c738 0x10c9b0）→ 构建后用 dSYM atos 符号化并打印到日志'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ipa:
    # v2.0.53：改回 macos-latest（Xcode 26，xcodegen 生成格式兼容）。
    # 之前 0 steps 失败其实是 private 仓库额度耗尽，不是 runner 故障；
    # macos-14 是 Xcode 15.4 读不了 xcodegen 2.45 生成的项目（Unable to read project）
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild -project 轻聊.xcodeproj \
            -scheme Qingliao \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA (Payload zip, for SideStore)
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/App.xcarchive/Products/Applications/Qingliao.app build/ipa/Payload/
          cd build/ipa && zip -qry ../qingliao-2.0-unsigned.ipa Payload/
          ls -la ../qingliao-2.0-unsigned.ipa

      - name: Verify IPA
        run: |
          file build/qingliao-2.0-unsigned.ipa
          unzip -l build/qingliao-2.0-unsigned.ipa | head -8

      - name: Upload dSYM artifact (崩溃符号化留底, v3.4.2)
        uses: actions/upload-artifact@v4
        with:
          name: qingliao-dsym
          path: build/App.xcarchive/dSYMs
          if-no-files-found: ignore

      - name: Symbolicate crash offsets (atos)
        if: ${{ github.event.inputs.crash_offsets != '' }}
        run: |
          python3 - <<'PYEOF'
          import subprocess
          off_s = "${{ github.event.inputs.crash_offsets }}"
          dsym = 'build/App.xcarchive/dSYMs/Qingliao.app.dSYM/Contents/Resources/DWARF/Qingliao'
          for off in off_s.split():
              try:
                  addr = 0x100000000 + int(off, 16)
                  r = subprocess.run(['atos', '-o', dsym, '-l', '0x100000000', hex(addr)],
                                     capture_output=True, text=True)
                  print(f'{off}: {r.stdout.strip() or r.stderr.strip()}')
              except Exception as e:
                  print(f'{off}: ERR {e}')
          PYEOF

      - name: Upload IPA to GitHub Release (Hermes 下载后转存 NAS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create qingliao-ipa-2 build/qingliao-2.0-unsigned.ipa \
            --repo ${{ github.repository }} \
            --title "轻聊 2.0 IPA (native, unsigned)" \
            --notes "原生 SwiftUI · iOS 27 液态玻璃 · SideStore 导入安装" \
            || gh release upload qingliao-ipa-2 build/qingliao-2.0-unsigned.ipa \
               --repo ${{ github.repository }} --clobber
          echo "RELEASE_UPLOADED"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingliao-2.0-unsigned-ipa
          path: build/qingliao-2.0-unsigned.ipa
          if-no-files-found: error
