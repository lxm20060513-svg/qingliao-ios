name: 轻聊
options:
  bundleIdPrefix: com.qingliao
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  Qingliao:
    type: application
    platform: iOS
    sources:
      - qingliao
    dependencies:
      # v3.8.0：灵动岛/锁屏实时活动挂件（embed: true → 编进 Qingliao.app/PlugIns/）
      - target: QingliaoWidget
        embed: true
      # v4.0.1：系统分享接收扩展（embed: true → 编进 Qingliao.app/PlugIns/）。
      # 侧载（免费签名）没有 App Groups，扩展与主 App 靠「URL scheme + 系统剪贴板」传内容，
      # 协议与两条通道见 qingliao/Core/ShareLinkCodec.swift 的文件头注释。
      - target: qingliaoShare
        embed: true
    info:
      path: qingliao/Info.plist
      properties:
        CFBundleDisplayName: 轻聊
        # 声明支持简体中文——系统组件（相机/分享面板/系统弹窗）界面语言跟随此列表，否则显示英文
        CFBundleDevelopmentRegion: zh_CN
        # v4.0.70：加 en —— 英文设备的桌面图标名走 qingliao/en.lproj/InfoPlist.strings = Qimo；
        # 中文设备仍是基准值「轻聊」（用户 2026-10-07 拍板：中文仍叫轻聊，英文叫 Qimo）
        # ⚠️ 已知取舍（v4.0.70 审查指出，不是漏改）：两个扩展 target（qingliaoWidget:180 /
        #    qingliaoShare:218）的 CFBundleDisplayName 仍是「轻聊」、也没有各自 .lproj ——
        #    英文设备上主屏图标 = Qimo，但小组件库 / 分享面板里仍显示「轻聊」。
        #    本次刻意只改主 App（用户口径「只改 App」）；要统一时给两个扩展各加 en + zh-Hans 的
        #    InfoPlist.strings（并各自声明 CFBundleLocalizations）。
        CFBundleLocalizations:
          - zh-Hans
          - en
        CFBundleShortVersionString: "4.0.85"
        CFBundleVersion: "641"
        UILaunchScreen: {}
        # v3.9.83：SCENE 生命周期 + 声明自己的 scene delegate。
        # SwiftUI 进程本就是 scene-based，而系统把「桌面图标长按项被点」**只发给 scene delegate**，
        # AppDelegate 的 performActionFor 永不被调用（v3.9.82 真机「点了不跳转」的根因）。
        # 注册途径有两条：AppDelegate 的 configurationForConnecting（优先）与本清单（兜底），两条都写。
        # 附带收益：iOS 27 SDK 起「非 scene app」直接不启动（Apple 已在 iOS 26 发警告），这步提前合规。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).QingliaoSceneDelegate"
        # v3.8.0：实时活动（灵动岛/锁屏「AI 正在回复」）——挂件代码在 QingliaoWidget target
        NSSupportsLiveActivities: true
        # v3.9.3：语音转文字改设备端识别（iOS 26 SpeechAnalyzer/SpeechTranscriber）
        # ⚠️ 麦克风权限串是必须的——本仓此前一个权限串都没声明（连麦克风都没有），
        #    而当年「侧载语音识别必闪退」的误判很可能就源于此
        NSMicrophoneUsageDescription: 用于语音转文字（设备端识别，录音不会上传）
        # 保险：Apple 文档对「SpeechAnalyzer 是否也校验这条」说法不一，一并声明（零成本）
        NSSpeechRecognitionUsageDescription: 用于语音转文字（设备端识别，录音不会上传）
        # 🚨 必须有：LAContext.evaluatePolicy(.deviceOwnerAuthentication*) 触发 Face ID 时
        # TCC 查这条权限串，缺失 = SIGABRT 闪退（v3.1.1 整块误删后漏补，2026-09-16 crash 实锤）
        NSFaceIDUsageDescription: 使用 Face ID 解锁密码管理与 App 锁
        # 同批误删漏补：拍照输入(CameraPicker)用相机
        NSCameraUsageDescription: 拍照发送给 AI 识别需要使用相机
        # SR7：图片查看器「保存到相册」直接调 UIImageWriteToSavedPhotosAlbum。
        # 缺这条权限串时 TCC 不是弹窗而是 **SIGABRT 闪退**（和上面 Face ID 那条同一类坑），
        # 且只在用户真点一次保存时才复现——声明先补上。
        NSPhotoLibraryAddUsageDescription: 把 AI 生成/聊天里的图片保存到你的相册
        # v3.9.95：AI 操控本地数据（权限与 AI 操控页 / ```ql-action 动作卡）
        # ⚠️ 缺权限串的后果分两种：EventKit/Photos 多数是"拒绝授权"，
        #    但历史上 FaceID/PhotoLibraryAdd 缺串直接 SIGABRT —— 声明先补上，别等真机崩。
        NSCalendarsFullAccessUsageDescription: 让轻聊在你确认后读取和修改你的日历
        NSPhotoLibraryUsageDescription: 让轻聊在你确认后读取相册图片供 AI 识别，或存入你选中的图片
        # v4.0.x：AI 本地动作扩容（提醒事项 / 通讯录 / 定位）。
        # ⚠️ 与上面 FaceID / PhotoLibraryAdd 同一条教训：缺权限串在真机上不是"弹窗被拒"而是
        #    **SIGABRT 闪退**，且只在用户真点一次该功能时复现 —— -parse 和 CI archive 都查不出。
        #    这三条一律"用到才触发"，漏补就是"用户第一次用就崩"，先声明再说。
        NSRemindersFullAccessUsageDescription: 让轻聊在你确认后读取你的待办提醒、新建提醒事项
        # v4.0.60 健康（HealthKit 只读）：同一条教训 —— 缺权限串在真机上是 SIGABRT 闪退，
        # 且只在用户真点一次「健康」时复现，-parse 与 CI archive 都查不出。
        NSHealthShareUsageDescription: 让轻聊在你确认后读取你的健康数据（步数/睡眠/心率等），用于回答你的健康问题
        NSContactsUsageDescription: 让轻聊在你确认后查询联系人、新建联系人
        NSLocationWhenInUseUsageDescription: 让轻聊在你确认后读取一次当前位置，用于回答「我在哪 / 附近有什么」
        # 文件读写走 App 自己的 Documents 沙盒（SandboxFiles）。打开文件 App 共享后，
        # 用户能在「文件」→ 我的 iPhone → 轻聊 里看到 AI 写的文件、也能自己放文件进去给 AI 读。
        UIFileSharingEnabled: true
        # SR8：后台刷新的 delegate 方法 application(_:performFetchWithCompletionHandler:)
        # （ChatView.swift 里那份「唤醒后查流式任务是否完成 → 本地通知」）**必须**声明
        # UIBackgroundModes: fetch 才会被系统调用；否则整条后台通知链路是死代码。
        # audio：TTS 朗读（SpeechManager/AVAudioSession）退到后台即被掐断，补上后可锁屏继续念。
        UIBackgroundModes:
          - fetch
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        # v3.4.14 系统分享接入口：声明能打开的文件类型/UTI，侧载 App 也能作为系统分享目标
        LSSupportsOpeningDocumentsInPlace: true
        # v3.4.25：注册 qingliao:// URL Scheme——地图/Safari 分享面板更稳定出现轻聊入口
        CFBundleURLTypes:
          - CFBundleURLName: com.qingliao.app2
            CFBundleURLSchemes:
              - qingliao
        # v3.4.25：AI 回复地点一键开地图——查询高德是否安装（canOpenURL 必须先声明白名单）
        LSApplicationQueriesSchemes:
          - iosamap
          # v3.9.71：动作条的「拨打 / 写邮件」用 canOpenURL 预检，不在白名单会被判 false
          # → 误报"没有能打开它的 App"（仓内已有为高德补白名单的先例）
          - tel
          - mailto
        CFBundleDocumentTypes:
          - CFBundleTypeName: 图片
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.image
          - CFBundleTypeName: 视频
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.movie
          - CFBundleTypeName: 音频
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.audio
          - CFBundleTypeName: 文本
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.text
          - CFBundleTypeName: PDF
            LSHandlerRank: Default
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: 通用文件
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.item
          - CFBundleTypeName: 数据
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingliao.app2
        INFOPLIST_KEY_CFBundleDisplayName: 轻聊
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "4.0.85"
        CURRENT_PROJECT_VERSION: "641"
        ENABLE_PREVIEWS: YES
        CODE_SIGNING_ALLOWED: "NO"

  # v3.8.0：实时活动挂件（灵动岛 + 锁屏）——只有实时活动一个 Widget，无主屏幕小组件
  QingliaoWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - qingliaoWidget
      # 实时活动属性类型：主 App 与挂件必须编同一份源码
      - qingliao/Core/LiveActivityAttributes.swift
      # v3.9.7：灵动岛按钮的 AppIntent——必须在主 App 与挂件**两个** target 里都存在，
      # 系统才会优先在 App 进程执行（只放挂件里会固定在挂件进程跑，触不到 App 的流）
      - qingliao/Core/LiveActivityActions.swift
      # v3.9.79：灵动岛图标改为「跟随卡通形象」——形象模型 + 矢量绘制两份纯源码进挂件。
      # 必须是这两个**干净文件**（无 @AppStorage/无 View），别把 PetAvatar.swift 整份塞进来：
      # 形象由 ContentState.petStyle 下发，挂件不读 UserDefaults（免费签名没有 App Groups）。
      - qingliao/Features/Chat/PetModel.swift
      - qingliao/Features/Chat/PetPainter.swift
    info:
      path: qingliaoWidget/Info.plist
      properties:
        CFBundleDisplayName: 轻聊
        CFBundlePackageType: XPC!
        # 扩展与宿主版本号必须一致（XcodeGen 对未声明的键默认写 1.0/1，会让 .appex 自报 1.0(1)）
        CFBundleShortVersionString: "4.0.85"
        CFBundleVersion: "641"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingliao.app2.widget
        MARKETING_VERSION: "4.0.85"
        CURRENT_PROJECT_VERSION: "641"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        SKIP_INSTALL: YES

  # v4.0.1：**系统分享接收扩展** —— 从别的 App（照片 / Safari / 备忘录…）把文本、链接、图片
  # 分享进轻聊**当前会话**（口径 1a：入口只留这三类，不声明 File/视频/音频）。
  #
  # ⚠️ 侧载（免费签名）**没有 App Groups**（与挂件同一约束）→ 扩展与主 App 没有共享容器：
  #    共享文件、共享 UserDefaults 全都不可用。所以内容只走两条**系统级**通道：
  #      ① `qingliao://share?...`（URL scheme，短文本/链接）——主 App 侧是既有的 .onOpenURL；
  #      ② 系统剪贴板（自定义类型，图片 / 超长文本）——扩展写、主 App 进前台时读。
  #    协议、去重令牌、档位都写在 qingliao/Core/ShareLinkCodec.swift 的文件头注释里；
  #    ⚠️ 另一条硬限制：**iOS 18 起扩展无法拉起宿主 App**（extensionContext.open 会被系统拒），
  #    所以「唤起轻聊」只算尽力而为，兜底是「内容已在剪贴板 + 用户手动打开轻聊」。
  qingliaoShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - qingliaoShare
      # 协议编解码：主 App 与扩展必须编**同一份**源码（同挂件编 LiveActivityAttributes 的做法），
      # 否则「怎么打包 / 怎么解包」两处各写一份必然漂移。纯 Foundation，两边都能编。
      - qingliao/Core/ShareLinkCodec.swift
    info:
      path: qingliaoShare/Info.plist
      properties:
        CFBundleDisplayName: 轻聊
        CFBundlePackageType: XPC!
        # 扩展与宿主版本号必须一致（XcodeGen 对未声明的键默认写 1.0/1，会让 .appex 自报 1.0(1)）
        CFBundleShortVersionString: "4.0.85"
        CFBundleVersion: "641"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          # 不用 storyboard：直接挂 VC 类（本仓没有 MainInterface.storyboard，少一份要同步的资源）
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          # 出现条件（口径 1a：用户拍板「分享入口只留文本 / 链接 / 图片」，故只声明我们**真的能收**的三类；
          # 视频 / 音频 / 文件都不声明 —— 轻聊现有的分享落点只能接文本与单图
          # （ShareRouter 一条 = 一图一文本），声明 File 会出现一个「点进去只发文件名、内容读不出」的入口）：
          #   · 文本、网页链接、图片 各一条
          #   · 网页归档（webarchive，二进制）不处理，故不声明 WebPage
          NSExtensionAttributes:
            NSExtensionActivationRule:
              # 2 = 「至少命中一类就出现」；缺省（1）是「宿主给的每一类都必须能处理才算」，
              # 那种规则下系统一次给「照片 + 视频」这类组合时整个入口会直接消失。
              NSExtensionActivationDictionaryVersion: 2
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingliao.app2.share
        MARKETING_VERSION: "4.0.85"
        CURRENT_PROJECT_VERSION: "641"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        SKIP_INSTALL: YES

schemes:
  Qingliao:
    build:
      targets:
        Qingliao: all
        QingliaoWidget: all
        # 分享扩展也在归档时编（embed: true 已让它成为 App 的依赖，这里再显式列一次 =
        # 直接用 `-scheme Qingliao archive` 也不会漏编）
        qingliaoShare: all
    run:
      config: Debug
    archive:
      config: Release