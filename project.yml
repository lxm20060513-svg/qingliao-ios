name: 轻聊
options:
  bundleIdPrefix: com.qingliao
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  Qingliao:
    type: application
    platform: iOS
    sources:
      - qingliao
    dependencies:
      # v3.8.0：灵动岛/锁屏实时活动挂件（embed: true → 编进 Qingliao.app/PlugIns/）
      - target: QingliaoWidget
        embed: true
    info:
      path: qingliao/Info.plist
      properties:
        CFBundleDisplayName: 轻聊
        # 声明支持简体中文——系统组件（相机/分享面板/系统弹窗）界面语言跟随此列表，否则显示英文
        CFBundleDevelopmentRegion: zh_CN
        CFBundleLocalizations:
          - zh-Hans
        CFBundleShortVersionString: "3.9.5"
        CFBundleVersion: "450"
        UILaunchScreen: {}
        # v3.8.0：实时活动（灵动岛/锁屏「AI 正在回复」）——挂件代码在 QingliaoWidget target
        NSSupportsLiveActivities: true
        # v3.9.3：语音转文字改设备端识别（iOS 26 SpeechAnalyzer/SpeechTranscriber）
        # ⚠️ 麦克风权限串是必须的——本仓此前一个权限串都没声明（连麦克风都没有），
        #    而当年「侧载语音识别必闪退」的误判很可能就源于此
        NSMicrophoneUsageDescription: 用于语音转文字（设备端识别，录音不会上传）
        # 保险：Apple 文档对「SpeechAnalyzer 是否也校验这条」说法不一，一并声明（零成本）
        NSSpeechRecognitionUsageDescription: 用于语音转文字（设备端识别，录音不会上传）
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        # v3.4.14 系统分享接入口：声明能打开的文件类型/UTI，侧载 App 也能作为系统分享目标
        LSSupportsOpeningDocumentsInPlace: true
        # v3.4.25：注册 qingliao:// URL Scheme——地图/Safari 分享面板更稳定出现轻聊入口
        CFBundleURLTypes:
          - CFBundleURLName: com.qingliao.app2
            CFBundleURLSchemes:
              - qingliao
        # v3.4.25：AI 回复地点一键开地图——查询高德是否安装（canOpenURL 必须先声明白名单）
        LSApplicationQueriesSchemes:
          - iosamap
        CFBundleDocumentTypes:
          - CFBundleTypeName: 图片
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.image
          - CFBundleTypeName: 视频
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.movie
          - CFBundleTypeName: 音频
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.audio
          - CFBundleTypeName: 文本
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.text
          - CFBundleTypeName: PDF
            LSHandlerRank: Default
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: 通用文件
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.item
          - CFBundleTypeName: 数据
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingliao.app2
        INFOPLIST_KEY_CFBundleDisplayName: 轻聊
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "3.9.5"
        CURRENT_PROJECT_VERSION: "450"
        ENABLE_PREVIEWS: YES
        CODE_SIGNING_ALLOWED: "NO"

  # v3.8.0：实时活动挂件（灵动岛 + 锁屏）——只有实时活动一个 Widget，无主屏幕小组件
  QingliaoWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - qingliaoWidget
      # 实时活动属性类型：主 App 与挂件必须编同一份源码
      - qingliao/Core/LiveActivityAttributes.swift
    info:
      path: qingliaoWidget/Info.plist
      properties:
        CFBundleDisplayName: 轻聊
        CFBundlePackageType: XPC!
        # 扩展与宿主版本号必须一致（XcodeGen 对未声明的键默认写 1.0/1，会让 .appex 自报 1.0(1)）
        CFBundleShortVersionString: "3.9.5"
        CFBundleVersion: "450"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingliao.app2.widget
        MARKETING_VERSION: "3.9.5"
        CURRENT_PROJECT_VERSION: "450"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        SKIP_INSTALL: YES

schemes:
  Qingliao:
    build:
      targets:
        Qingliao: all
        QingliaoWidget: all
    run:
      config: Debug
    archive:
      config: Release
