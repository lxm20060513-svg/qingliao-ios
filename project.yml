name: 轻聊
options:
  bundleIdPrefix: com.qingliao
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  Qingliao:
    type: application
    platform: iOS
    sources:
      - qingliao
    info:
      path: qingliao/Info.plist
      properties:
        CFBundleDisplayName: 轻聊
        CFBundleShortVersionString: "3.4.4"
        CFBundleVersion: "408"
        NSLocationWhenInUseUsageDescription: 用于获取当前定位显示天气信息
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingliao.app2
        INFOPLIST_KEY_CFBundleDisplayName: 轻聊
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "3.4.4"
        CURRENT_PROJECT_VERSION: "408"
        ENABLE_PREVIEWS: YES
        CODE_SIGNING_ALLOWED: "NO"
