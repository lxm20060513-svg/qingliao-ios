name: 轻聊
options:
  bundleIdPrefix: com.qingliao
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  Qingliao:
    type: application
    platform: iOS
    sources:
      - qingliao
    info:
      path: qingliao/Info.plist
      properties:
        CFBundleDisplayName: 轻聊
        CFBundleShortVersionString: "3.4.26"
        CFBundleVersion: "430"
        NSLocationWhenInUseUsageDescription: 用于获取当前定位显示天气信息
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        # v3.4.14 系统分享接入口：声明能打开的文件类型/UTI，侧载 App 也能作为系统分享目标
        LSSupportsOpeningDocumentsInPlace: true
        # v3.4.25：注册 qingliao:// URL Scheme——地图/Safari 分享面板更稳定出现轻聊入口
        CFBundleURLTypes:
          - CFBundleURLName: com.qingliao.app2
            CFBundleURLSchemes:
              - qingliao
        # v3.4.25：AI 回复地点一键开地图——查询高德是否安装（canOpenURL 必须先声明白名单）
        LSApplicationQueriesSchemes:
          - iosamap
        CFBundleDocumentTypes:
          - CFBundleTypeName: 图片
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.image
          - CFBundleTypeName: 视频
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.movie
          - CFBundleTypeName: 音频
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.audio
          - CFBundleTypeName: 文本
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.text
          - CFBundleTypeName: PDF
            LSHandlerRank: Default
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: 通用文件
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.item
          - CFBundleTypeName: 数据
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingliao.app2
        INFOPLIST_KEY_CFBundleDisplayName: 轻聊
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "3.4.26"
        CURRENT_PROJECT_VERSION: "430"
        ENABLE_PREVIEWS: YES
        CODE_SIGNING_ALLOWED: "NO"
